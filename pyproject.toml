[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regression-detector"
version = "0.1.0"
description = "Model regression detection system - Phase 1: classifier, prompt versioning, golden-dataset eval runner"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
